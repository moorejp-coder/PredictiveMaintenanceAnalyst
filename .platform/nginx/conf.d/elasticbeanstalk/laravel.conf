# Send every request that is not a real file to Laravel's front controller.
# Without this, nginx returns 404 for routes like /api/readings.
#
# Files nginx serves itself (CSS, JS, fonts, images, robots.txt) never reach
# Laravel, so they get the security headers here. Requests that fall through
# to index.php leave this block, so Laravel's SecurityHeaders middleware sets
# their headers and nothing is sent twice. Keep the values in step with
# app/Http/Middleware/SecurityHeaders.php (SecurityHeadersTest checks them).
# Browsers ignore Strict-Transport-Security on plain http.
location / {
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    try_files $uri $uri/ /index.php?$query_string;
}
